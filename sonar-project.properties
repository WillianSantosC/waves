# ============================================================================
# SonarCloud Project Configuration
#
# Configures how SonarCloud analyzes the project, including:
# - Project identity
# - Source code location
# - TypeScript configuration
# - Test coverage (Vitest)
# - Files excluded from analysis, coverage and duplication detection
#
# Documentation:
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
# ============================================================================

# ============================================================================
# Project Identity
# ============================================================================
# Replace these values with the actual keys created in SonarCloud.
sonar.projectKey=WillianSantosC_waves
sonar.organization=lian-org

# ============================================================================
# Source Code
# ============================================================================
# Waves is a bun workspaces monorepo (apps/*, packages/*). Only application
# source code should be analyzed.
sonar.sources=apps/*/src,packages/*/src

# ============================================================================
# TypeScript
# ============================================================================
# Use the project's primary TypeScript configuration.
sonar.typescript.tsconfigPath=tsconfig.json

# ============================================================================
# Test Coverage
# ============================================================================
# Path to the LCOV report generated by:
#   bun run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ============================================================================
# Global Analysis Exclusions
# ============================================================================
# Files excluded entirely from SonarCloud analysis.
#
# These files do not contribute to:
# - Complexity
# - Bugs
# - Vulnerabilities
# - Code Smells
# - Duplications
#
# Keep this list focused on generated files and non-production code.
sonar.exclusions=\
  **/*.test.ts,\
  **/test.integration.ts,\
  **/*.spec.ts,\
  **/*.d.ts,\
  **/__snapshots__/**,\
  **/*.snap,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*config.*,\
  **/tests/**,\
  **/e2e/**

# ============================================================================
# Coverage Exclusions
# ============================================================================
# Files ignored only when calculating test coverage.
#
# They will still be analyzed for quality unless also excluded above.
#
# Add paths here only when unit tests would not materially increase confidence
# (thin pages, layouts, types-only modules, etc.).
# — "New Code Coverage (SonarCloud)". Prefer narrow paths; justify in the PR.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/test.integration.ts,\
  **/*.spec.ts,\
  **/e2e/**,\
  **/*.d.ts,\
  **/tests/**

# ============================================================================
# Copy/Paste Detection (CPD)
# ============================================================================
# Files ignored by SonarCloud's duplication engine.
#
# Snapshot files are automatically generated and naturally contain
# repeated content, so they should not affect duplication metrics.
sonar.cpd.exclusions=\
  **/__snapshots__/**,\
  **/*.snap,\
  **/tests/**

# ============================================================================
# Test File Detection
# ============================================================================
# Identifies test files so SonarCloud reports them separately from
# production code.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/test.integration.ts,\
  **/*.spec.ts

# ============================================================================
# Encoding
# ============================================================================
sonar.sourceEncoding=UTF-8
