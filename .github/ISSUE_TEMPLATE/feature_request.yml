name: ✨ Feature Request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: "Describe the problem you want to solve, not just the solution."

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? From the user's perspective.
      placeholder: |
        "As someone orchestrating multi-node workflows, I cannot tell which node
        consumed the most budget after a run. I have to manually grep through
        evidence files to reconstruct per-node token usage."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: |
        "Add a `waves budget report <workflow-run-id>` CLI command that reads the
        durable workflow evidence and prints a per-node token/cost breakdown."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: |
        "I considered exposing this only as a dashboard, but a CLI command is
        more useful for CI pipelines and scripting, and a dashboard can
        consume the same underlying data later."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "🔴 High — Significantly improves the core use case"
        - "🟡 Medium — Nice to have, improves the experience"
        - "🟢 Low — Minor enhancement or polish"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What would "done" look like?
      placeholder: |
        - [ ] `waves budget report <workflow-run-id>` command exists and is documented
        - [ ] Per-node token/cost breakdown is read from durable evidence, not recomputed
        - [ ] Output remains provider-neutral (no vendor-specific pricing assumptions baked in)
        - [ ] Covered by a CLI E2E test

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to related ADRs, contracts, or similar implementations.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and confirmed this has not been requested
          required: true
        - label: I described the problem, not just the solution
          required: true
