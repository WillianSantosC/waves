name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Please provide as much detail as possible to help us investigate quickly."

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      placeholder: "When a workflow node fails and retries, the budget tracker double-counts the token usage from the failed attempt..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Define a workflow with a node that has a BudgetPolicy limit of 1000 tokens
        2. Trigger a failure in that node so it retries once
        3. Inspect the workflow evidence/state after completion
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "Only the token usage from the successful attempt should count against the node's budget."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: "The failed attempt's token usage is persisted and summed with the retry, causing the node to exceed its budget and abort incorrectly."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "🔴 Critical — Application unusable / data loss"
        - "🟠 High — Major feature broken, no workaround"
        - "🟡 Medium — Feature impaired, workaround exists"
        - "🟢 Low — Minor / cosmetic / edge case"
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Affected Component
      placeholder: "packages/core/budget, CLI command, provider adapter name, etc."

  - type: dropdown
    id: executor
    attributes:
      label: Agent Executor / Provider (if relevant)
      options: [Claude Code, Codex, Other / N/A]

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local CLI, CI, Not environment-specific]

  - type: textarea
    id: screenshots
    attributes:
      label: Logs, Evidence, or Stack Traces
      description: Drag and drop logs/screenshots or paste stack traces, workflow state dumps, or evidence output here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I provided enough detail to reproduce the bug
          required: true
