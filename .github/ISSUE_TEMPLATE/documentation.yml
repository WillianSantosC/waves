name: 📚 Documentation
description: Report missing, outdated, or unclear documentation
title: "docs: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Use this template to report documentation problems or request new docs."

  - type: dropdown
    id: type
    attributes:
      label: Documentation Issue Type
      options:
        - "📝 Missing documentation (topic not covered)"
        - "🔄 Outdated documentation (no longer accurate)"
        - "❓ Unclear documentation (exists but confusing)"
        - "🔗 Broken link or missing reference"
        - "✏️ Typo or grammar error"
        - "📖 New documentation requested"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Which file, section, or URL has the problem?
      placeholder: "docs/architecture/ → Provider Adapters → Capability Registration"

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What is wrong or missing? Quote the problematic text if applicable.
      placeholder: |
        "The Provider Adapters doc describes registering a provider via a
        `registerExecutor()` call, but the current API uses `ProviderRegistry.register()`.
        The documented example no longer compiles against the current contract."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Improvement
      description: What should it say instead?
      placeholder: |
        "Update the example to use `ProviderRegistry.register()` and link to the
        current ADR describing the provider registration contract."

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links to external docs, or related issues.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and confirmed this has not been reported
          required: true
